# «Что нового»: what each release of Barrens Voice brought, for players. The one source of it: the companion writes
# the entries of its version into the addon (NewsData.lua: the window and the chat line after an update), and
# tools/release.py makes the GitHub release's description from the release's entry. CHANGELOG.md stays the
# developers' English list.
#
# One [[entry]] per release, newest first, keyed by the program's version (pyproject.toml's, which every release
# raises; the addon's own version does not matter here). Russian, «ты», short: what the player will notice and what
# to do, no technical details, not the CHANGELOG retold (DEVELOPMENT.md, «Что нового»).
#   version  the release ("0.4.1"); a test build's own ("0.4.1b3") only to tell testers what a later build brought
#   date     "DD.MM.YYYY", set at release (none while the release is in work)
#   kind     "big": a feature or something that works differently (the window opens after login);
#            "small": fixes and dictionary words only (one chat line with the summary)
#   title    the heading
#   summary  one line for the chat, no full stop at the end
#   items    a few short points, one line each
# The game's font has no «→» or en dash (use «=», «—» or «-»), and «|» starts the game's markup: none of them here.

