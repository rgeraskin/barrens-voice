# CurseForge and Wago Addons: the addon alone (.pkgmeta), zipped by BigWigsMods/packager (docs/adr/0008-addon-sites.md).
# - With a tag (release.yml after a release, or by hand for a release whose upload failed): Dictionary.lua stamped as
#   the release's archive, the sites' changelog written, the zip checked, then uploaded to the projects the
#   repository's variables CF_PROJECT_ID and WAGO_PROJECT_ID name (either alone is fine) with the secrets
#   CF_API_TOKEN and WAGO_API_TOKEN.
# - Without one (ci.yml on every push, or by hand): the same zip, checked, nothing uploaded; with CF_API_TOKEN set,
#   the token is tried on CurseForge's list of game versions (what the packager asks first), which must have
#   Forever's. Wago has no such request: its project and key show only at the first upload.
name: Addon sites
on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "A release (vX.Y.Z) to upload again; empty: build and check only"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  addon-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}       # empty: the commit the workflow runs for
          fetch-depth: 0               # the packager names the zip by the nearest tag; D.REVISION as the archive's
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - if: inputs.tag != ''
        run: mise run addon-sites "$TAG"      # D.REVISION stamped, .addon-sites-notes.md; a test build stops here
        env:
          TAG: ${{ inputs.tag }}
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812  # v2.7.0
        with:
          args: -d                     # first the zip alone, to look at before anything goes up
          pandoc: false
      - run: mise run addon-sites --check .release/*.zip   # the addon and nothing else
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: addon-zip
          path: .release/*.zip
          retention-days: 7
      - name: CurseForge token
        if: inputs.tag == ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then echo "no CF_API_TOKEN: not checked"; exit 0; fi
          curl -fsS -H "x-api-token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/wow/versions |
            jq -e 'map(select(.gameVersionTypeID == 88568)) | length > 0' > /dev/null   # 88568: Forever
          echo "CurseForge: the token works, Forever's versions are there"
      - if: inputs.tag != '' && (vars.CF_PROJECT_ID != '' || vars.WAGO_PROJECT_ID != '')
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812  # v2.7.0
        with:
          args: -p ${{ vars.CF_PROJECT_ID || '0' }} -a ${{ vars.WAGO_PROJECT_ID || '0' }}
          pandoc: false
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
