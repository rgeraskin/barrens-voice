[tools]
python = "3.13.18"
uv = "0.13.7"
luajit = "2.1.1744318430"

[env]
# uv uses mise's Python instead of downloading its own
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
# the uv project (pyproject.toml + uv.lock): .venv created by uv when missing and activated
python.uv_venv_auto = "create|source"

[tasks.test]
description = "All tests: Python (with the optional libraries) and Lua"
depends = ["test-py", "test-lua"]

[tasks.test-py]
description = "Python tests; the protocol test runs the addon's encoder with luajit"
run = "uv run --locked python -m unittest discover -s companion/tests"

[tasks.test-lua]
description = "Addon tests on WoW API stubs: windows, payloads, visible-chat filter, dictionary layers"
dir = "addon/BarrensVoice"
run = [
  "luajit ../../companion/tests/ui_mock.lua",
  "luajit ../../companion/tests/dictionary_layers.lua",
]

[tasks.icon]
description = "Redraw the addon icon (Icon.tga), the launcher icon (icon.ico) and tools/icon_preview.png"
run = "uv run --locked python tools/make_icon.py"

[tasks.voices-table]
description = "Regenerate companion/bv/game_voices.json (which game files hold each race voice) from the community listfile"
run = "uv run --locked python tools/game_voices.py"

[tasks.build]
description = "Release archive and manifest.json into dist/ (tools/release.py)"
run = "uv run --locked python tools/release.py"

[tasks.sign]
description = "Sign dist/manifest.json (tools/sign.py): BV_SIGNING_KEY or ~/.config/barrens-voice/release-signing.key"
run = "uv run --locked python tools/sign.py sign"

[tasks.installer]
description = "Windows: release archive, uv.exe and dist/BarrensVoice-Setup.exe (tools/installer.py, Inno Setup 6)"
run = "uv run --locked python tools/installer.py"
